services:
  # PHP Application (PHP 8.3 FPM + Composer + Node.js)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        user: www
        uid: 1000
    container_name: gentleman-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gentleman
      DB_USERNAME: root
      DB_PASSWORD: root
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - gentleman-network
    depends_on:
      - db

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: gentleman-web
    restart: unless-stopped
    ports:
      - "${DOCKER_WEB_PORT:-8000}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gentleman-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: gentleman-db
    restart: unless-stopped
    ports:
      - "${DOCKER_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: gentleman
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - gentleman-dbdata:/var/lib/mysql
    networks:
      - gentleman-network

  # phpMyAdmin (Optional DB GUI)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gentleman-phpmyadmin
    restart: unless-stopped
    ports:
      - "${DOCKER_PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    networks:
      - gentleman-network
    depends_on:
      - db

networks:
  gentleman-network:
    driver: bridge

volumes:
  gentleman-dbdata:
    driver: local
